# 預設分支有新的版本號時，自動建立 GitHub Release，附件固定為 survey-fee-calculator.html
# 下載最新版：https://github.com/gn01918004-hub/calculator/releases/latest/download/survey-fee-calculator.html
name: Release

on:
  push:
    paths:
      - index.html
      - scripts/build.sh
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: ./scripts/build.sh

      - name: Create release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="v$(cat dist/version.txt)"
          if gh release view "$ver" >/dev/null 2>&1; then
            echo "$ver 已發布過，略過"
            exit 0
          fi
          gh release create "$ver" dist/survey-fee-calculator.html \
            --target "$GITHUB_SHA" \
            --title "囑託測量收費試算 $ver" \
            --notes-file dist/release-notes.md \
            --latest
